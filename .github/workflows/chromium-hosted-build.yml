name: Chromium hosted build (experiment)

# Tests whether GitHub-hosted macOS runners can build Bark's Chromium by
# chaining resumable stages under the six-hour job limit. Produces an unsigned
# app only: no release keys, no publishing.
on:
  workflow_dispatch:
    inputs:
      deadline_minutes:
        description: Minutes into each stage at which the build is paused for archiving
        type: number
        default: 255
  push:
    branches: [ci/hosted-chromium-build]

permissions:
  contents: read

concurrency:
  group: chromium-hosted-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 1
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage2:
    needs: stage1
    if: needs.stage1.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 2
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage3:
    needs: stage2
    if: needs.stage2.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 3
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage4:
    needs: stage3
    if: needs.stage3.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 4
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage5:
    needs: stage4
    if: needs.stage4.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 5
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage6:
    needs: stage5
    if: needs.stage5.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 6
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage7:
    needs: stage6
    if: needs.stage6.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 7
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
  stage8:
    needs: stage7
    if: needs.stage7.outputs.finished == 'false'
    uses: ./.github/workflows/chromium-hosted-stage.yml
    with:
      stage: 8
      deadline_minutes: ${{ inputs.deadline_minutes || 255 }}
