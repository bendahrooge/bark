name: Native Bark

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tools/tests
  shared-core:
    name: Shared Swift core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: '6.2.1'
      - uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - run: swift --version
      - run: swift test --scratch-path .build/core

  chromium-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 tools/chromium.py verify-patches
