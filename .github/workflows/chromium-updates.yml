name: Check Chromium source updates

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compare pinned source with upstream stable
        run: python3 tools/chromium.py check
      - name: Verify Bark patches against pinned upstream source
        run: python3 tools/chromium.py verify-patches
