name: Publish signed macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bark version (for example 0.1.0)'
        required: true
        type: string
      build:
        description: 'Increasing integer build number (for example 1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    # This runner holds release keys. Never run PR code or arbitrary branches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, bark-release]
    timeout-minutes: 720
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      BARK_CHROMIUM_WORK_DIR: ${{ vars.BARK_CHROMIUM_WORK_DIR }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate inputs and runner credentials
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"tools"); from release_macos import read_config,release_info; release_info(read_config(),os.environ["RELEASE_VERSION"],os.environ["RELEASE_BUILD"])'
          test -n "$BARK_CHROMIUM_WORK_DIR"
          xcrun notarytool history --keychain-profile bark-notary --output-format json >/dev/null
          command -v gh
      - name: Test source
        run: |
          python3 -m unittest discover -s tools/tests
          swift test --scratch-path .build/core
          python3 tools/test_chromium_swift.py
      - name: Build Chromium with updater integration
        run: python3 tools/chromium.py build --target mac-arm64 --jobs 6
      - name: Sign and notarize
        run: |
          python3 tools/release_macos.py \
            --source "$BARK_CHROMIUM_WORK_DIR/src/out/Bark-mac-arm64/Bark.app" \
            --chromium-src "$BARK_CHROMIUM_WORK_DIR/src" \
            --version "$RELEASE_VERSION" --build "$RELEASE_BUILD"
      - name: Publish complete release and feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/publish_release.py \
            --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" \
            --notes "docs/releases/$RELEASE_VERSION.md" --publish
