name: Chromium hosted build stage

# One resumable slice of the hosted-runner Chromium build. Each stage restores
# the previous stage's work directory, builds until its deadline, then archives
# the directory for the next stage. See chromium-hosted-build.yml.
on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      deadline_minutes:
        type: number
        default: 255
    outputs:
      finished:
        description: "'true' once the browser target has been built"
        value: ${{ jobs.build.outputs.finished }}

permissions:
  contents: read

env:
  # The path must be identical in every stage: the build files record it.
  WORK: /Users/runner/bark-chromium
  PARTS: /Users/runner/bark-chromium-parts

jobs:
  build:
    name: Stage ${{ inputs.stage }}
    runs-on: macos-latest
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - name: Record stage start
        run: echo "STAGE_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report runner capacity
        run: |
          sw_vers
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
          xcodebuild -version
          df -h /
      - name: Free disk space
        run: |
          selected="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            [ "$(cd "$app" && pwd -P)" = "$selected" ] && continue
            sudo rm -rf "$app"
          done
          xcrun simctl delete all || true
          sudo rm -rf "${ANDROID_HOME:-/Users/runner/Library/Android/sdk}" \
            /Users/runner/Library/Developer/CoreSimulator/Caches \
            /Users/runner/.dotnet || true
          df -h /
      - name: Install build prerequisites
        run: |
          command -v zstd || brew install zstd
          command -v git-lfs || brew install git-lfs
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Download previous stage
        if: inputs.stage > 1
        uses: actions/download-artifact@v8
        with:
          name: chromium-work
          path: ${{ env.PARTS }}
      - name: Restore previous stage
        if: inputs.stage > 1
        run: |
          mkdir -p "$WORK"
          cat "$PARTS"/work.tar.zst.* | zstd -dc | tar -xpf - -C "$WORK"
          rm -rf "$PARTS"
          df -h /
      - name: Sync pinned Chromium source
        if: inputs.stage == 1
        run: |
          python3 tools/chromium.py sync --work-dir "$WORK" --github-mirror --min-free-gb 40
          df -h /
      - name: Build until the stage deadline
        id: build
        env:
          DEADLINE_MINUTES: ${{ inputs.deadline_minutes }}
        run: |
          python3 - <<'PY'
          import os, signal, subprocess, sys, time
          remaining = int(os.environ['STAGE_START']) + int(os.environ['DEADLINE_MINUTES']) * 60 - time.time()
          if remaining < 600:
              sys.exit('Less than ten minutes of build time left in this stage; raise deadline_minutes')
          print(f'Building for up to {remaining / 60:.0f} minutes', flush=True)
          build = subprocess.Popen(['python3', 'tools/chromium.py', 'build', '--work-dir', os.environ['WORK'],
                                    '--target', 'mac-arm64'], start_new_session=True)
          finished = False
          try:
              code = build.wait(timeout=remaining)
              if code:
                  sys.exit(code)
              finished = True
          except subprocess.TimeoutExpired:
              # Interrupt the whole process group so the build tool stops cleanly
              # and leaves a state the next stage can resume.
              os.killpg(build.pid, signal.SIGINT)
              try:
                  build.wait(timeout=600)
              except subprocess.TimeoutExpired:
                  os.killpg(build.pid, signal.SIGKILL)
                  build.wait()
              print('Deadline reached; pausing the build for the next stage', flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"finished={'true' if finished else 'false'}\n")
          PY
          df -h /
      - name: Archive work directory for the next stage
        if: steps.build.outputs.finished == 'false'
        run: |
          mkdir -p "$PARTS"
          tar -cpf - -C "$WORK" . | zstd -T0 -3 | split -b 1900m - "$PARTS/work.tar.zst."
          du -sh "$PARTS"
          df -h /
      - name: Upload work directory
        if: steps.build.outputs.finished == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: chromium-work
          path: ${{ env.PARTS }}
          compression-level: 0
          overwrite: true
          retention-days: 2
          if-no-files-found: error
      - name: Check the built browser starts
        if: steps.build.outputs.finished == 'true'
        run: |
          "$WORK/src/out/Bark-mac-arm64/Bark-dev.app/Contents/MacOS/Bark" --version
          du -sh "$WORK/src/out/Bark-mac-arm64"
      - name: Validate native Chromium extensions
        if: steps.build.outputs.finished == 'true'
        continue-on-error: true
        run: |
          "$WORK/src/third_party/node/mac_arm64/node-darwin-arm64/bin/node" tools/test_chromium_browser.mjs \
            "$WORK/src/out/Bark-mac-arm64/Bark-dev.app/Contents/MacOS/Bark"
      - name: Package unsigned app
        if: steps.build.outputs.finished == 'true'
        run: tar -cpf - -C "$WORK/src/out/Bark-mac-arm64" Bark-dev.app | zstd -T0 -10 > "$RUNNER_TEMP/Bark-mac-arm64-unsigned.tar.zst"
      - name: Upload unsigned app
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Bark-mac-arm64-unsigned
          path: ${{ runner.temp }}/Bark-mac-arm64-unsigned.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
